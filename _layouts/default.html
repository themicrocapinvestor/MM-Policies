<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | The Microcap Minute</title>
<style>
  :root { --ink:#1a1a1a; --mute:#5b6470; --rule:#e3e6ea; --link:#0b5fff; --bg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8eaed; --mute:#9aa3ad; --rule:#2b3038; --link:#7aa7ff; --bg:#14161a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; }
  .wrap { max-width:46rem; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
  header.site { border-bottom:1px solid var(--rule); padding-bottom:1rem; margin-bottom:2.25rem; }
  header.site a.home { font-weight:700; font-size:1.05rem; color:var(--ink); text-decoration:none; }
  header.site .sub { color:var(--mute); font-size:.9rem; margin-top:.15rem; }
  h1 { font-size:1.9rem; line-height:1.25; margin:0 0 .4rem; letter-spacing:-.01em; }
  h2 { font-size:1.15rem; margin:2.2rem 0 .6rem; letter-spacing:-.005em; }
  p, li { color:var(--ink); }
  em { color:var(--mute); font-style:normal; font-size:.9rem; }
  a { color:var(--link); }
  img { max-width:100%; height:auto; border:1px solid var(--rule); margin:.6rem 0; }
  ul { padding-left:1.15rem; }
  li { margin:.3rem 0; }
  hr { border:0; border-top:1px solid var(--rule); margin:2.5rem 0 1.5rem; }
  footer.site { border-top:1px solid var(--rule); margin-top:3rem; padding-top:1.25rem;
                color:var(--mute); font-size:.9rem; }
  footer.site a { text-decoration:none; }
  .back { display:inline-block; margin-top:.5rem; }
  .pagenav2 { position:fixed; left:0; top:45%; z-index:70; }
  .pagenav2 .tab { background:#C9A227; color:#080808; font-weight:700; font-size:11px;
    letter-spacing:1px; padding:10px 7px; border-radius:0 4px 4px 0; writing-mode:vertical-rl;
    text-transform:uppercase; cursor:default; }
  .pagenav2 .links { display:none; position:absolute; left:100%; top:0; background:#171717;
    border:1px solid #C9A227; border-radius:0 6px 6px 6px; padding:10px 0; min-width:160px; }
  .pagenav2:hover .links { display:block; }
  .pagenav2 .links a { display:block; color:#d9d9d9; font-size:12.5px; padding:8px 16px;
    text-decoration:none; }
  .pagenav2 .links a:hover { color:#C9A227; background:#080808; }
  .pagenav2 .links .sep { display:block; border-top:1px solid #333; margin:6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="home" href="https://www.themicrocapminute.in/">The Microcap Minute</a>
    <div class="sub">Policies</div>
  </header>

  {{ content }}

  <footer class="site">
    <a href="https://www.themicrocapminute.in/">&larr; Back to The Microcap Minute</a><br>
    <a class="back" href="{{ '/' | relative_url }}">All policies</a>
  </footer>
</div>
<div class="pagenav2"><span class="tab">Pages</span><span class="links">
<a href="https://themicrocapinvestor.github.io/smart-investor-tracker/index.html">Filing Feed</a>
<a href="https://themicrocapinvestor.github.io/smart-investor-tracker/portfolios.html">Portfolios</a>
<a href="https://themicrocapinvestor.github.io/smart-investor-tracker/promoter-buying.html">Promoter Buying</a>
<a href="https://themicrocapinvestor.github.io/smart-investor-tracker/special-situations.html">Special Situations</a><span class="sep"></span>
<a href="https://www.themicrocapminute.in">The Microcap Minute</a>
<a href="https://themicrocapinvestor.github.io/MM-Policies/">Policies</a></span></div>
</body>
</html>
